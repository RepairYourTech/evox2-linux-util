# Configuration for evo-x2-thermal-osd (the thermal-mode on-screen display).
#
# Installed to /etc/evo-x2-linux-osd.conf.  After editing, apply with:
#     sudo systemctl restart evo-x2-thermal-osd

[osd]
# Which desktop user should receive the notifications.  Leave empty to
# auto-detect the first logged-in graphical session (recommended).
user =

# How often to read the embedded controller, in seconds.
#
# On the GMKtec EVO-X2 this is the *only* thing that detects a button press:
# the WMI notify for the button's GUID is never published to the ACPI netlink
# feed, so there is no event to listen for and the poll is what you actually
# feel.  One second keeps the on-screen display responsive.
#
# A user can override this, and show_notifications, in
# ~/.config/evo-x2-linux-osd/settings.conf -- which is what the Preferences page
# in the Thermal Mode window writes.  Everything else here is deliberately not
# overridable, so that this file stays the administrator's.
poll_interval = 1.0

# Also subscribe to the kernel's ACPI netlink feed.  Nothing arrives on the
# EVO-X2 (verified at debug log level across a full button cycle), but this
# costs nothing and makes the response instant on firmware that does publish
# the event.
use_acpi_events = yes

# Mirror the hardware mode into power-profiles-daemon, so a button press also
# changes the OS power profile.  Quiet -> power-saver, Balanced -> balanced,
# Performance/Sustained -> performance.  Ignored if powerprofilesctl is absent.
sync_power_profiles = yes

# Also reconcile the OS profile with the hardware mode once at startup.
# Leave this off if you prefer to manage the OS profile by hand and only want
# the daemon to follow the physical button.
sync_on_start = no

# Show a desktop notification when the mode changes.
show_notifications = yes

# Re-apply the last mode at startup.  Only useful if the firmware forgets the
# selection across a power cycle; if it keeps it, the EC already reads back the
# same mode and nothing is written.  The matching switch in the window lives in
# the session user's settings, so this file is the fallback for a machine where
# nobody has set it.
restore_on_boot = no

# How long the toast stays on screen, in milliseconds.
notify_timeout_ms = 3000

# debug, info, warning, error
log_level = info

# Override the icons shown in the notification.  Any name from the active icon
# theme works, or an absolute path to a PNG/SVG.
#
# The defaults are the icons this package installs into hicolor, which is why
# they resolve on every desktop.  Do not switch them to
# power-profile-*-symbolic: those exist in Adwaita and Yaru but not in Breeze or
# hicolor, so on KDE, Fedora and Arch the notification icon silently disappears.
# Names ending in -symbolic are a second trap: a symbolic icon is recoloured by
# the theme from the `currentColor` it is written with, and Qt -- which draws the
# notification icon on KDE -- cannot parse `currentColor` at all, so it renders
# black and disappears against a dark panel.  The shipped icons have one bar per
# mode level and explicit colours.
[icons]
# quiet = evo-x2-quiet
# balanced = evo-x2-balanced
# performance = evo-x2-performance
# sustained = evo-x2-sustained
