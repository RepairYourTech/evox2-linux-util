<!--
  Sustained (mode 3): four narrow bars, purple.  This is the undocumented fourth
  mode the EC accepts (see docs/HOW-IT-WORKS.md); it is only shown if a config
  opts into it.

  The bars are narrower than the rest of the family so that four of them still
  fit the 16 px grid without merging into a block.

  See evo-x2-quiet.svg for why the bars are counted, why there is no
  `currentColor`, and how the colours were chosen.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <rect x="1.125" y="8" width="2.5" height="5" rx="1.25" fill="#a05ab8"/>
  <rect x="4.875" y="6" width="2.5" height="7" rx="1.25" fill="#a05ab8"/>
  <rect x="8.625" y="4" width="2.5" height="9" rx="1.25" fill="#a05ab8"/>
  <rect x="12.375" y="2" width="2.5" height="11" rx="1.25" fill="#a05ab8"/>
</svg>
